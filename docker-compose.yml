services:
  postgres:
    image: postgres:16-alpine
    container_name: oauth_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: oauth_user
      POSTGRES_PASSWORD: oauth_password
      POSTGRES_DB: oauth_db
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: oauth_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data

  mailpit:
    image: axllent/mailpit:latest
    container_name: oauth_mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # Porta SMTP
      - "8025:8025" # Interface Web (http://localhost:8025)

volumes:
  pgdata:
  redisdata: